[project]
name = "nepali_text_frontend"
version = "0.1.0"
description = "Research-grounded Nepali text frontend and G2P profiles for TTS"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ampixa"}]

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "nepali_frontend",
    "nepali_frontend.code_switch",
    "nepali_frontend.g2p",
    "nepali_frontend.normalize",
    "nepali_frontend.tokenize",
    "nepali_frontend.prosody",
    "real_nepali",
]

[project.scripts]
nepali-frontend = "nepali_frontend.__main__:main"
nepali-tts-manifest = "real_nepali.manifest:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
